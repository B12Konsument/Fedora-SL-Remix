name: Build experimental AArch64 release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: fedora-sl7-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install the container runtime
        run: sudo apt-get update && sudo apt-get install -y jq podman zip
      - name: Configure the container runtime for the hosted ARM runner
        run: |
          sudo install -D -m 0644 build/containers-ci.conf /etc/containers/containers.conf.d/90-fedora-sl7-ci.conf
          sudo podman system renumber
      - name: Reclaim runner workspace
        run: |
          sudo find /usr/local/lib/android -depth -delete 2>/dev/null || true
          sudo find /opt/ghc -depth -delete 2>/dev/null || true
          df -h /
      - name: Build redistribution-safe artifacts
        env:
          MIN_FREE_GIB: "55"
        run: |
          sudo --preserve-env=MIN_FREE_GIB ./build.sh --output "$GITHUB_WORKSPACE/artifacts"
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/artifacts"
      - name: Smoke-test the AArch64 live environment in QEMU
        run: |
          iso=$(find artifacts -maxdepth 1 -name '*.iso' -print -quit)
          ./scripts/personalize-test-iso.sh "$iso" artifacts/personalization-layout.json artifacts/qemu-smoke.iso
          sudo podman run --rm --security-opt label=disable \
            --entrypoint /workspace/scripts/qemu-smoke.sh \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            localhost/fedora-sl7-remix-builder:latest \
            /workspace/artifacts/qemu-smoke.iso 300
          sudo find artifacts/qemu-smoke.iso -delete
      - name: Prepare GitHub-sized assets
        run: |
          mkdir release-assets
          iso=$(find artifacts -maxdepth 1 -name '*.iso' -print -quit)
          ./scripts/split-release.sh "$iso" release-assets artifacts/personalization-layout.json
          cp artifacts/{RPM-MANIFEST.txt,SOURCE-MANIFEST.json,LICENSE-REPORT.json,Fedora-SL7-Remix.spdx.json} release-assets/
          (cd release-assets && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS)
      - name: Publish experimental release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --verify-tag \
            --title "Fedora SL7 Remix $RELEASE_TAG (experimental)" \
            --notes "Experimental personalization base for the Windows ISO creator. Do not boot the base image directly. Secure Boot must be disabled. Microsoft firmware is not distributed by this release. The touchscreen is known broken."
