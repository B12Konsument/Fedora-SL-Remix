name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y cpio jq libxml2-utils ripgrep shellcheck zip
      - name: Validate repository inputs
        env:
          REQUIRE_PWSH: "1"
        run: ./tests/run.sh
  windows-personalizer:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Pester
        shell: powershell
        run: Install-Module Pester -Force -Scope CurrentUser -RequiredVersion 5.7.1
      - name: Test the native Windows personalizer
        shell: powershell
        run: Invoke-Pester -Path tests/windows -CI
  build-packages-and-prepare-kernel:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install the container runtime
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Configure the container runtime for the hosted ARM runner
        run: |
          sudo install -D -m 0644 build/containers-ci.conf /etc/containers/containers.conf.d/90-fedora-sl7-ci.conf
          sudo podman system renumber
      - name: Build the pinned Fedora builder
        run: sudo podman build --tag fedora-sl7-remix-builder --file build/Containerfile build
      - name: Verify locked sources and build integration RPMs
        run: |
          sudo podman run --rm --security-opt label=disable \
            --entrypoint /bin/bash \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            localhost/fedora-sl7-remix-builder:latest \
            -lc '/workspace/scripts/fetch-sources.sh && SKIP_KERNEL_BUILD=1 /workspace/scripts/build-rpms.sh'
      - name: Verify the Fedora kernel patch queue
        run: |
          sudo podman run --rm --security-opt label=disable \
            --entrypoint /bin/bash \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            localhost/fedora-sl7-remix-builder:latest \
            -lc '/workspace/scripts/build-kernel.sh --prepare-only'
